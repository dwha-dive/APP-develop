name: Collect Market Data

on:
  schedule:
    # 매일 1회 — 미국 장마감 후 (21:05 UTC = 익일 06:05 KST)
    - cron: '05 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pykrx yfinance requests beautifulsoup4 lxml pytz

      - name: Collect all data
        run: python data_collector/run_all.py --all

      - name: Commit & push data.json
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add public/data.json
          git commit -m "data: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')" || echo "No changes"
          git push
