name: Collect Market Data

on:
  schedule:
    # 한국 장마감 후 (15:35 KST = 06:35 UTC)
    - cron: '35 6 * * 1-5'
    # 미국 장마감 후 (21:05 KST 다음날 = 21:05 UTC)
    - cron: '05 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pykrx yfinance requests beautifulsoup4 lxml pytz

      - name: Detect session and collect
        run: python data_collector/run_all.py

      - name: Commit & push data.json
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add public/data.json
          git commit -m "data: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')" || echo "No changes"
          git push
